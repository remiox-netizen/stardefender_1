name: Build Android APK

# Paleidimas: GitHub svetainėje Actions -> "Build Android APK" -> Run workflow
# (taip pat paleidžiamas automatiškai kiekvieną kartą įkėlus failus).
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Atsisiųsti kodą
        uses: actions/checkout@v4

      - name: Sukompiliuoti APK (buildozer)
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Išsaugoti APK
        uses: actions/upload-artifact@v4
        with:
          name: StarDefender-apk
          path: ${{ steps.buildozer.outputs.filename }}
