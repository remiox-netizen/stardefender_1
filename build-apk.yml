name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Atsisiųsti kodą
        uses: actions/checkout@v4

      - name: Įdiegti Linux priklausomybes
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake \
            libffi-dev libssl-dev

      - name: Įdiegti Buildozer
        run: |
          pip3 install --user --upgrade buildozer cython==0.29.33
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sukompiliuoti APK
        run: |
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          export BUILDOZER_WARN_ON_ROOT=0
          buildozer android debug

      - name: Išsaugoti APK
        uses: actions/upload-artifact@v4
        with:
          name: StarDefender-apk
          path: bin/*.apk
```
